services:
  - type: web
    name: govcareer-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_USER
        fromDatabase:
          name: govcareer-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: govcareer-db
          property: password
      - key: DATABASE_HOST
        fromDatabase:
          name: govcareer-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: govcareer-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: govcareer-db
          property: database
      - key: COMPATIBILITY_DEVELOPMENT_USER_EMAIL
        value: development@govcareer.local

databases:
  - name: govcareer-db
    plan: free
    region: singapore
    databaseName: govcareer
    user: govcareer
