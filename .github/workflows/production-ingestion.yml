name: Production Job Ingestion

on:
  schedule:
    # Every 30 minutes. GitHub Actions supports scheduled workflows on the
    # default branch and this keeps ingestion independent of serverless API lifetimes.
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: production-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      COMPATIBILITY_DEVELOPMENT_USER_EMAIL: ${{ secrets.COMPATIBILITY_DEVELOPMENT_USER_EMAIL }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run due source ingestion
        run: python scripts/run_ingestion.py
