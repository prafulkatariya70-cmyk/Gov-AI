name: Production Job Ingestion

on:
  schedule:
    # Every 30 minutes. GitHub Actions supports scheduled workflows on the
    # default branch and this keeps ingestion independent of serverless API lifetimes.
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: production-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      # The host is not a credential. Keep a project-specific fallback so a
      # missing Actions secret cannot silently send PostgreSQL to localhost.
      DATABASE_HOST: ${{ secrets.DATABASE_HOST || 'aws-0-ap-south-1.pooler.supabase.com' }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT || '6543' }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME || 'postgres' }}
      COMPATIBILITY_DEVELOPMENT_USER_EMAIL: ${{ secrets.COMPATIBILITY_DEVELOPMENT_USER_EMAIL }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required database configuration
        env:
          REQUIRED_DATABASE_USER: ${{ secrets.DATABASE_USER }}
          REQUIRED_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          test -n "$REQUIRED_DATABASE_USER" || { echo "::error::GitHub Actions secret DATABASE_USER is missing"; exit 1; }
          test -n "$REQUIRED_DATABASE_PASSWORD" || { echo "::error::GitHub Actions secret DATABASE_PASSWORD is missing"; exit 1; }
          test -n "$DATABASE_HOST" || { echo "::error::DATABASE_HOST is missing"; exit 1; }
          test "$DATABASE_HOST" != "localhost" || { echo "::error::DATABASE_HOST resolved to localhost"; exit 1; }
          echo "Database connection settings are present (credentials not displayed)."

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run due source ingestion
        run: python scripts/run_ingestion.py
