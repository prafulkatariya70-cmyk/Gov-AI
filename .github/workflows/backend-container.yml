name: Backend Container Check

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-container.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-container.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build container
        run: docker build -f backend/Dockerfile backend
